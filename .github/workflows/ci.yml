name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - run: cargo test --locked
      # The command-line build must not need the window's libraries at all.
      - run: cargo build --locked --no-default-features --bin t3-import-cli
      - run: cargo build --locked
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          if ldd target/debug/t3-import-cli | grep -Ei "gtk|webkit"; then
            exit 1
          fi

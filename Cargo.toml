[package]
name = "t3-import"
version = "0.1.0"
edition = "2024"
description = "Import Claude Code, Codex, Grok and OpenCode sessions into T3 Code"
license = "MIT"
repository = "https://github.com/paulomanrique/t3code-import"
readme = "README.md"
keywords = ["t3code", "claude", "codex", "cli", "import"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
hex = "0.4.3"
ratatui = "0.30.2"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.37"
sha2 = "0.11.0"
toml = "1.1.8"
urlencoding = "2.1.3"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
